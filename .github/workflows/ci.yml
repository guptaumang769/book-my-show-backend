name: CI

# Runs on every push and PR to main. Green checkmarks here are what recruiters
# see on your repo — this is the GitHub-native equivalent of a Jenkins pipeline.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The GitHub-hosted runner has a Docker daemon available, so Testcontainers
    # (Postgres/Redis) work out of the box — no service containers needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

      - name: Publish test report
        if: always()   # publish even when tests fail, so failures are visible
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          path: '**/surefire-reports/*.xml'
          reporter: java-junit

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test   # only build the image if tests pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        # Build only (no push) on CI. Add a login + push step with your
        # Docker Hub / ECR credentials when you want images published.
        run: docker build -t book-my-show-backend:${{ github.sha }} .
