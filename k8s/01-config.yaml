# Non-secret configuration → ConfigMap. Secret values (DB password, JWT secret)
# go in the Secret below. In a real cluster the Secret would come from an external
# manager (AWS Secrets Manager via External Secrets Operator, Sealed Secrets, etc.)
# — never committed base64 like this. It's inline here only so the demo is runnable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bms-config
  namespace: bookmyshow
data:
  DB_URL: "jdbc:postgresql://postgres:5432/bookmyshow"
  DB_USER: "bms"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
---
apiVersion: v1
kind: Secret
metadata:
  name: bms-secret
  namespace: bookmyshow
type: Opaque
stringData:
  DB_PASSWORD: "bms"
  JWT_SECRET: "change-me-to-a-32-byte-minimum-secret-key!!"
