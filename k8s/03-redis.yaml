# Redis for seat locks. A plain Deployment is fine here because our lock data is
# ephemeral by design (locks have a 10-min TTL); we don't need durable storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bookmyshow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: bookmyshow
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
