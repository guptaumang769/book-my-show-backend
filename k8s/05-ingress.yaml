# Ingress exposes the app outside the cluster via an ingress controller
# (nginx locally; on AWS EKS this becomes an ALB via the AWS Load Balancer Controller).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bms-ingress
  namespace: bookmyshow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: bookmyshow.local     # add "127.0.0.1 bookmyshow.local" to /etc/hosts for local testing
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bms-app
                port:
                  number: 80
